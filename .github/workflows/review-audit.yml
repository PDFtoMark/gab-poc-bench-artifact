name: Review Audit PoC
on:
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Audit (mirrors larksuite/cli comment-audit)
        run: |
          echo "AUDIT_REF=$GITHUB_REF"
          echo "AUDIT_SHA=$GITHUB_SHA"
          echo "AUDIT_EVENT=$GITHUB_EVENT_NAME"
          bash scripts/audit.sh
